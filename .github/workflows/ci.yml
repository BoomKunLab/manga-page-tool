name: Test and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  CGO_ENABLED: '0'
  GOTOOLCHAIN: local

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build release archives
        shell: bash
        run: |
          mkdir -p dist
          go_root=$(go env GOROOT)
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${platform%/*}
            arch=${platform#*/}
            package=mangatool-${GITHUB_REF_NAME}-${os}-${arch}
            mkdir -p "$package/licenses"
            cp LICENSE README.md "$package/"
            cp "$go_root/LICENSE" "$package/licenses/Go.txt"
            binary=mangatool
            if [[ "$os" == windows ]]; then
              binary=mangatool.exe
            fi
            GOOS="$os" GOARCH="$arch" go build -buildvcs=false -trimpath \
              -ldflags="-s -w -X main.releaseVersion=$GITHUB_REF_NAME" \
              -o "$package/$binary" ./cmd/mangatool
            modules=$(GOOS="$os" GOARCH="$arch" go list -buildvcs=false -deps \
              -f '{{with .Module}}{{if not .Main}}{{.Path}} {{.Dir}}{{end}}{{end}}' ./cmd/mangatool |
              sed '/^$/d' | sort -u)
            while read -r module module_dir; do
              license_dir="$package/licenses/$module"
              mkdir -p "$license_dir"
              license="$module_dir/LICENSE"
              if [[ ! -f "$license" ]]; then
                license="$module_dir/LICENSE.txt"
              fi
              cp "$license" "$license_dir/"
              for notice in NOTICE PATENTS; do
                if [[ -f "$module_dir/$notice" ]]; then
                  cp "$module_dir/$notice" "$license_dir/"
                fi
              done
            done <<< "$modules"
            if [[ "$os" == windows ]]; then
              python3 -m zipfile -c "dist/$package.zip" "$package"
            else
              tar -czf "dist/$package.tar.gz" "$package"
            fi
          done
          cd dist
          sha256sum ./*.tar.gz ./*.zip > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
