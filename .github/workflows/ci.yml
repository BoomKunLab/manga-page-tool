name: Test and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  CGO_ENABLED: '0'
  GOTOOLCHAIN: local

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build release archives
        shell: bash
        run: |
          mkdir -p dist
          go mod download github.com/HugoSmits86/nativewebp golang.org/x/image
          go_root=$(go env GOROOT)
          webp_module=$(go list -mod=readonly -m -f '{{.Dir}}' github.com/HugoSmits86/nativewebp)
          image_module=$(go list -mod=readonly -m -f '{{.Dir}}' golang.org/x/image)
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${platform%/*}
            arch=${platform#*/}
            package=mangatool-${GITHUB_REF_NAME}-${os}-${arch}
            mkdir -p "$package/licenses"
            cp LICENSE README.md "$package/"
            cp "$go_root/LICENSE" "$package/licenses/Go.txt"
            cp "$webp_module/LICENSE" "$package/licenses/nativewebp.txt"
            cp "$image_module/LICENSE" "$package/licenses/golang.org-x-image.txt"
            binary=mangatool
            if [[ "$os" == windows ]]; then
              binary=mangatool.exe
            fi
            GOOS="$os" GOARCH="$arch" go build -buildvcs=false -trimpath \
              -ldflags="-s -w -X main.releaseVersion=$GITHUB_REF_NAME" \
              -o "$package/$binary" ./cmd/mangatool
            if [[ "$os" == windows ]]; then
              python3 -m zipfile -c "dist/$package.zip" "$package"
            else
              tar -czf "dist/$package.tar.gz" "$package"
            fi
          done
          cd dist
          sha256sum ./*.tar.gz ./*.zip > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
