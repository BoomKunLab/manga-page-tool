name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example, v0.3.6)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      version: ${{ inputs.version }}
